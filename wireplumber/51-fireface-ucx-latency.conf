# Tell PipeWire the Fireface UCX's own latency, so JACK and PipeWire clients
# (a DAW recording a loopback, for one) compensate for it.
#
# PipeWire reports only its own buffering for an ALSA node; it doesn't read
# the driver's delay. The rest of the round trip is the unit (converters and
# FIFOs) and the driver's playback queue, a fixed number of frames:
#
#   playback: 2 URBs x urb_blocks (2) x 8 frames = 32 frames
#   capture:  the rest of the measured round trip = 73 frames
#
# Measured with jack_iodelay through a Line Out -> Line In cable at 32, 44.1
# and 48 kHz (quantum 64): 105 frames more than PipeWire reported at each
# rate, 0 with these values. The total is measured; how the unit's own part
# splits between output and input is not, so all of it is on capture.
#
# These are the only rates PipeWire can run the unit at with the Pro Audio
# profile (18 channels; double and quad speed have fewer). The values are for
# the driver's default urb_blocks=2; with urb_blocks=4 the playback queue is
# 64 frames, so make the playback value 64.
#
# Install as ~/.config/wireplumber/wireplumber.conf.d/ or
# /etc/wireplumber/wireplumber.conf.d/51-fireface-ucx-latency.conf (the NixOS
# module does this), then restart WirePlumber or replug the unit.

monitor.alsa.rules = [
  {
    matches = [
      {
        alsa.driver_name = "snd_fireface_ucx"
        api.alsa.pcm.stream = "playback"
      }
    ]
    actions = {
      update-props = {
        latency.internal.rate = 32
      }
    }
  }
  {
    matches = [
      {
        alsa.driver_name = "snd_fireface_ucx"
        api.alsa.pcm.stream = "capture"
      }
    ]
    actions = {
      update-props = {
        latency.internal.rate = 73
      }
    }
  }
]
